name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
          - target: darwin-amd64
            os: macos-13
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/build-artifact.sh ${{ matrix.target }}
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload assets
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}