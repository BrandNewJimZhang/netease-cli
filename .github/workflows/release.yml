name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish, e.g. v0.1.0
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
          - target: darwin-amd64
            os: macos-14
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/build-artifact.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Resolve tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi
      - name: Create release
        run: gh release create "$ref" --verify-tag --generate-notes || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload assets
        run: gh release upload "$ref" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}